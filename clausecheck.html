 <div class="card" style="margin:1rem 0"><b>${t("cats")}</b>${by.map(x=>`<button class="bar ${f===x.c.id?"on":""}" onclick="S.filter=${f===x.c.id?"null":`'${x.c.id}'`};render()"><span>${x.c.n[i()]}</span><i style="width:${x.n/mx*50}%"></i><span>${x.n}</span></button>`).join("")||`<p class="mu">${t("empty")}</p>`}${f?`<button class="g" onclick="S.filter=null;render()">${t("all")}</button>`:""}</div>
 ${f?"":`<h3>${t("top")}</h3>`+top.map(clauseCard).join("")+"<hr>"}${f?list.map(clauseCard).join(""):R.r.map(clauseCard).join("")}`}
 return h}
function runA(){const x=$("#ta").value;S.text=x;if(!x.trim()){$("#msg").textContent=t("none");return}
 $("#msg").innerHTML='<div class="scan"></div>';setTimeout(()=>{S.res=analyze(x);S.filter=null;render()},500)}
function upl(el){const f=el.files[0];if(!f)return;if(!/\.txt$/i.test(f.name)){$("#msg").textContent=t("pdfn");return}const r=new FileReader();r.onload=()=>{S.text=String(r.result);render()};r.readAsText(f)}
const tok=s=>new Set(s.toLowerCase().match(/[\p{L}\p{N}]+/gu)||[]);
function sim(a,b){const A=tok(a),B=tok(b);let n=0;A.forEach(w=>B.has(w)&&n++);return n/(A.size+B.size-n||1)}
const NEG=/\b(do not|does not|never|will not|won’t|won't|not)\b/i;
function risk(p){const c=cats(p)[0];if(!c)return 0;return NEG.test(p)&&c.id==="share"?0:W[c.l]}
function diff(a,b){const A=a.split(/\s+/),B=b.split(/\s+/),sa=new Set(A.map(w=>w.toLowerCase())),sb=new Set(B.map(w=>w.toLowerCase()));
 return{o:A.map(w=>sb.has(w.toLowerCase())?esc(w):`<del>${esc(w)}</del>`).join(" "),n:B.map(w=>sa.has(w.toLowerCase())?esc(w):`<ins>${esc(w)}</ins>`).join(" ")}}
function compare(o,n){const O=paras(o),N=paras(n),used=new Set(),out={add:[],rem:[],mod:[]};
 N.forEach(p=>{let best=-1,bs=0;O.forEach((q,k)=>{if(used.has(k))return;const s=sim(p,q);if(s>bs){bs=s;best=k}});
  if(bs>=.95){used.add(best)}else if(bs>=.4){used.add(best);out.mod.push({o:O[best],n:p,s:bs})}else out.add.push({n:p})});
 O.forEach((q,k)=>{if(!used.has(k))out.rem.push({o:q})});
 const sc=a=>Math.min(100,a.reduce((s,p)=>s+risk(p)*1.5,0)|0);return{...out,os:sc(O),ns:sc(N),O,N}}
function expl(it,kind){const I=i(),c=cats(it.n||it.o)[0];let ro=it.o?risk(it.o):0,rn=it.n?risk(it.n):0,d=rn-ro;
 const nm=c?c.n[I]:(I?"सामान्य शर्त":"General term");const tx=I?(kind==="add"?`नई शर्त जुड़ी: ${nm}।`:kind==="rem"?`पुरानी शर्त हटी: ${nm}।`:`शर्त बदली: ${nm}।`):(kind==="add"?`New clause: ${nm}.`:kind==="rem"?`Removed clause: ${nm}.`:`Changed clause: ${nm}.`);
 const rc=kind==="add"?rn:kind==="rem"?-ro:d;return{tx:tx+(c?" "+c.x[I]:""),up:rc>0,dn:rc<0}}
function cmpCard(it,kind){const e=expl(it,kind),cls={add:"add",rem:"rem",mod:"mod"}[kind],L=t(kind==="add"?"added":kind==="rem"?"removed":"modified");
 let body=kind==="mod"?(d=>`<div class="cols"><div><b class="sm">${t("old")}</b><blockquote>${d.o}</blockquote></div><div><b class="sm">${t("new")}</b><blockquote>${d.n}</blockquote></div></div>`)(diff(it.o,it.n)):`<blockquote>${esc(it.n||it.o)}</blockquote>`;
 return`<div class="card ${cls}" style="margin:.7rem 0;border-width:2px"><b>${L}</b> ${e.up?`<span class="pill H">${t("up")}</span>`:e.dn?`<span class="pill L">${t("down")}</span>`:""}${body}${S.hexp?`<p class="sm">${e.tx}</p>`:""}</div>`}
function viewCompare(){let h=`<h2>${t("cmp")}</h2><div class="cols"><div><b>${t("old")}</b><textarea id="to">${esc(S.old)}</textarea></div><div><b>${t("new")}</b><textarea id="tn">${esc(S.nw)}</textarea></div></div>
<div class="row" style="margin:.7rem 0"><button onclick="runC()">${t("cgo")}</button><button class="g" onclick="S.old=SO;S.nw=SA;render()">${t("sample")}</button></div><div id="msg" role="status"></div>`;
 const R=S.cmp;if(R){const nh=R.add.filter(a=>risk(a.n)>=10).length,rd=R.rem.filter(a=>risk(a.o)>0).length+R.mod.filter(m=>risk(m.n)<risk(m.o)).length,dl=R.ns-R.os;
 h+=`<div class="grid"><div class="card"><div class="mu">${t("oldS")}</div><div class="big">${R.os}</div></div><div class="card"><div class="mu">${t("newS")}</div><div class="big">${R.ns}</div><span class="pill ${dl>0?"H":dl<0?"L":"M"}">${dl>0?t("up"):dl<0?t("down"):t("same")}</span></div>
 <div class="card"><div class="mu">${t("sum")}</div><div>${t("added")}: <b>${R.add.length}</b></div><div>${t("removed")}: <b>${R.rem.length}</b></div><div>${t("modified")}: <b>${R.mod.length}</b></div><div>${t("newHigh")}: <b>${nh}</b></div><div>${t("reduced")}: <b>${rd}</b></div></div></div>
 <div class="card" style="margin:1rem 0">${[["oldS",R.os],["newS",R.ns]].map(([k,v])=>`<div class="bar" style="cursor:default"><span>${t(k)}</span><i style="width:${v/100*60}%;background:${k==="newS"&&v>R.os?"var(--rd)":"var(--bl)"}"></i><span>${v}</span></div>`).join("")}</div>
 <button class="${S.hexp?"on":""}" onclick="S.hexp=!S.hexp;render()">🇮🇳 ${t("hexp")}</button> ${S.hexp?`<span class="sm mu">${t("hexpOn")}</span>`:""}<p class="sm mu">${t("unc")}</p>
 ${R.add.map(x=>cmpCard(x,"add")).join("")}${R.mod.map(x=>cmpCard(x,"mod")).join("")}${R.rem.map(x=>cmpCard(x,"rem")).join("")}`}
 return h}
function runC(){S.old=$("#to").value;S.nw=$("#tn").value;if(!S.old.trim()||!S.nw.trim()){$("#msg").textContent=t("none");return}
 $("#msg").innerHTML='<div class="scan"></div>';setTimeout(()=>{S.cmp=compare(S.old,S.nw);render()},500)}
function viewHome(){return`<section class="hero"><div class="shield">🛡️</div><h1>${t("h1")}</h1><p>${t("sub")}</p><div class="row"><button onclick="go('an')">${t("b1")}</button><button style="background:var(--lv)" onclick="go('cmp')">${t("b2")}</button><button class="g" onclick="document.getElementById('how').scrollIntoView({behavior:'smooth'})">${t("b3")}</button></div></section>
<section id="how" class="grid">${t("how").map((x,k)=>`<div class="card"><b>${["📄","🔍","🇮🇳"][k]}</b><p>${x}</p></div>`).join("")}</section>`}
function render(){nav();const y=window.scrollY;$("#app").innerHTML=({home:viewHome,an:viewAnalyze,cmp:viewCompare})[S.tab]()+`<footer class="card sm mu">⚖️ ${t("disc")}</footer>`;}
document.documentElement.lang=S.lang;render();
</script></body></html>
